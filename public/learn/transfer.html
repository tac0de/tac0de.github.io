<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>Transfer · CSS agent exercise</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; color: #171715; background: #f0eee6; font: 18px/1.5 system-ui, sans-serif; }
main { max-width: 640px; margin: auto; }
h1 { font-size: clamp(32px, 7vw, 64px); margin: 0; letter-spacing: -.04em; }
fieldset { display: flex; gap: 24px; margin: 20px 0; padding: 16px; border: 2px solid; }
label { display: inline-flex; align-items: center; gap: 10px; }
input { width: 28px; height: 28px; accent-color: #b92915; }
button { font: inherit; padding: 10px 18px; background: #171715; color: #f0eee6; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid #b92915; outline-offset: 4px; }
.output { min-height: 72px; }
#signal-on { display: none; width: fit-content; padding: 8px 16px; background: #b92915; color: #fff; }
</style>
</head>
<body><main>
<p>THE POWER OF CSS / AGENT PRACTICE</p>
<h1>Make the condition visible.</h1>
<p>Follow your task's Boolean condition. Edit submission.css; keep this document unchanged.</p>
<form id="transfer">
<fieldset><legend>Inputs</legend>
<section class="first-input"><label for="signal-x">X <input id="signal-x" type="checkbox"></label></section>
<section class="second-input"><label for="signal-y">Y <input id="signal-y" type="checkbox"></label></section>
</fieldset>
<div class="output"><span id="signal-on">● ON</span></div>
<button id="restore" type="reset">Reset inputs</button>
</form>
</main></body></html>
